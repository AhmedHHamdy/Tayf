appId: com.tayf.overlay
productName: Tayf
asar: true
compression: maximum
afterPack: build/after-pack.js

directories:
  output: dist
  buildResources: build

asarUnpack:
  - "**/node_modules/koffi/**"

files:
  - src/**/*
  - assets/**/*
  - package.json

publish:
  provider: github
  owner: Fathi-Mohammed
  repo: Tayf
  releaseType: draft

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  shortcutName: Tayf
  artifactName: Tayf-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: Tayf-${arch}.dmg
  category: public.app-category.productivity
  darkModeSupport: true
  electronLanguages:
    - en
  identity: null
  extendInfo:
    LSUIElement: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Tayf-${arch}.${ext}
  category: Utility
  executableName: tayf
  icon: build/icon.png
