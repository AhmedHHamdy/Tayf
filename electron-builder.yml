appId: com.tayf.overlay
productName: Tayf
asar: true
compression: maximum
afterPack: build/after-pack.js

directories:
  output: dist
  buildResources: build

asarUnpack:
  - "**/node_modules/koffi/**"

files:
  - src/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: Tayf.exe

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: Tayf-${arch}.dmg
  category: public.app-category.productivity
  darkModeSupport: true
  electronLanguages:
    - en
  identity: null
  extendInfo:
    LSUIElement: true
